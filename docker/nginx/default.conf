server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Uploads are large; this must be at least as generous as PHP's
    # upload_max_filesize or nginx rejects the request before PHP sees it.
    client_max_body_size 2G;

    # Large uploads and slow clients should not be cut off mid-transfer.
    client_body_timeout 300s;
    send_timeout 300s;
    proxy_read_timeout 300s;
    fastcgi_read_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static files bypass PHP, so they need these headers set here. Dynamic
    # responses get them from the application's own middleware; setting them at
    # server level too would emit each one twice.
    location /build/ {
        # Build output is content-hashed, so it can be cached indefinitely.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cache real static assets, but fall through to the application when the
    # path is not a file on disk. Share URLs end in the uploaded file's own
    # name (/f/{code}/photo.jpg), so a bare `=404` here would stop those
    # requests from ever reaching PHP.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php?$query_string;
    }

    # Internal hand-off target. FileController can send X-Accel-Redirect for a
    # stored blob and let nginx stream it, freeing the PHP worker immediately.
    location /internal-files/ {
        internal;
        alias /var/www/html/storage/app/private/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
