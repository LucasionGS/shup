[www]
; Uploads and downloads hold a worker for the duration of the transfer, so the
; pool is sized for concurrent transfers rather than raw request throughput.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface PHP errors in the container log rather than swallowing them.
catch_workers_output = yes
decorate_workers_output = no
