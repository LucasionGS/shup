; Shup runtime tuning.
;
; The upload limits are the ceiling for a single request. The chunked upload
; endpoint exists so large files do not depend on these, but direct uploads and
; the ShareX integration still do, so keep them generous and in step with
; nginx's client_max_body_size.
upload_max_filesize = 2G
post_max_size = 2G

; A folder upload sends many files in one request. PHP silently drops files past
; this limit, so it is raised well above the client's per-batch size.
max_file_uploads = 200

; Long enough for a large upload or a streamed archive over a slow connection.
max_execution_time = 600
max_input_time = 600

; Streaming means memory no longer scales with file size, so this is a guard
; rail rather than a working limit.
memory_limit = 512M

expose_php = Off

; Archives and large downloads are streamed. Buffering or compressing them at
; the PHP layer would accumulate the whole response in memory first, which is
; exactly what the streaming code exists to avoid.
output_buffering = Off
zlib.output_compression = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
